name: NN sync experiments

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/ack_coordinator/**'
      - 'tools/sqlite_retirement/**'
      - '.github/workflows/nn-sync-experiments.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ack_coordinator/**'
      - 'tools/sqlite_retirement/**'
      - '.github/workflows/nn-sync-experiments.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nn-sync-experiments:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.8'
      - name: Report Python and SQLite versions
        run: |
          python -B -c "import sys, sqlite3; print(sys.version); print('SQLite', sqlite3.sqlite_version)"
          exit $LASTEXITCODE
      - name: Run standalone ACK tests
        run: |
          python -B -m unittest discover -s tools/ack_coordinator -v
          exit $LASTEXITCODE
      - name: Run standalone SQLite tests (including owned-process termination)
        run: |
          python -B -m unittest discover -s tools/sqlite_retirement -p 'test_*.py' -v
          exit $LASTEXITCODE
