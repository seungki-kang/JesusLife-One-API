name: Sync model

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sync-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.8'
      - name: Run sync model tests
        run: python -B -m unittest discover -s tools/sync_model -v
      - name: Explore sync model
        run: python -B tools/sync_model/explore.py
